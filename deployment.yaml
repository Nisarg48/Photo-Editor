apiVersion: apps/v1
kind: Deployment
metadata:
  name: photo-editor-deployment
  namespace: photo-editor
  labels:
    app: photo-editor-deployment # just tags this Deployment object, not used for matching
spec:
  replicas: 2 # how many Pod copies to keep running
  selector:
    matchLabels:
      app: photo-editor # must match template.metadata.labels below, exactly
  template:
    metadata:
      labels:
        app: photo-editor # same as spec.selector.matchLabels.app
    spec:
      containers:
      - name: photo-editor-container
        image: nisarg48/photo-editor:latest
        ports:
        - containerPort: 80 # must match Service targetPort, and what nginx actually binds to