apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: photo-editor-ingress
  namespace: photo-editor
  labels:
    app.kubernetes.io/name: photo-editor-ingress
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
spec:
  ingressClassName: alb
  rules:
  - http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: photo-editor-service
            port: 
              number: 80